```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Devolución</title>
</head>
<body>

    <h1>Devolución de Producto</h1>

    <form>

        <label for="producto">Producto:</label>
        <input type="text" id="producto" name="producto" required>

        <br><br>

        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" name="cantidad" min="1" required>

        <br><br>

        <label for="fecha">Fecha de devolución:</label>
        <input type="date" id="fecha" name="fecha" required>

        <br><br>

        <label for="motivo">Motivo de la devolución:</label>
        <select id="motivo" name="motivo" required>
            <option value="">Seleccione un motivo</option>
            <option value="defectuoso">Producto defectuoso</option>
            <option value="incorrecto">Producto incorrecto</option>
            <option value="danado">Producto dañado</option>
            <option value="otro">Otro</option>
        </select>

        <br><br>

        <label for="observaciones">Observaciones:</label>
        <br>
        <textarea id="observaciones" name="observaciones" rows="5" cols="40"></textarea>

        <br><br>

        <button type="submit">Registrar devolución</button>
        <button type="reset">Limpiar</button>

    </form>

</body>
</html>
```
